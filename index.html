<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/bootstrap.min.css">

<body style="background-color:#f6f8ff ;">



<div class="text-center mt-8">
  <h4 id="demo" class="fg-black">Lorem ipsum dolor sit amet.</h4>
  
  <button data-color="green" data-location="left" class="btn-solid theme-danger">left</button>
  <button data-color="red" data-location="center" class="btn-solid theme-warning">center</button>
  <button data-color="black" data-location="right" class="btn-solid theme-black">right</button>

</div>











  <div class="container mt-12">
    <div class="row fg-black">
      <div class="md:col-10 m-auto">
        <h3 class="text-center">To Do List</h3>
        <form id="myForm">
          <input type="text" id="works" class="form-control my-5" placeholder="Enter your work">
  
          <input type="submit" value="Create" class="btn-solid theme-accent w-100">
        </form>
  
        <table class="table caption-top mt-7  w-100">
          <thead>
            <tr class="text-uppercase">
              <th scope="col">Work</th>
              <th scope="col" class="text-right w-3">Delete</th>
            </tr>
          </thead>
  
          <tbody id="result"></tbody>
        </table>
      </div>
    </div>
  
  </div>
  
  
  
 












  <script src="js/bootstrap.bundle.min.js"></script>
